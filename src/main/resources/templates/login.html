<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HMS - Clinical Portal Login</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .login-card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            border: none;
            overflow: hidden;
            width: 100%;
            max-width: 450px;
        }
        .login-header {
            background-color: #0d6efd;
            color: white;
            padding: 30px;
            text-align: center;
        }
        .login-header i {
            font-size: 3rem;
            margin-bottom: 10px;
        }
        .login-body {
            padding: 40px 30px;
        }
        .form-control:focus {
            box-shadow: 0 0 0 0.25rem rgba(13, 110, 253, 0.25);
        }
    </style>
</head>
<body>

<div class="login-card">
    <div class="login-header">
        <i class="bi bi-hospital"></i>
        <h4 class="mb-0 fw-bold">Hospital Management System</h4>
        <small class="opacity-75">Clinical Portal Administration</small>
    </div>
    <div class="login-body">
        <div id="alertBox" class="alert alert-danger d-none" role="alert"></div>
        
        <form id="loginForm">
            <div class="mb-3">
                <label for="username" class="form-label text-secondary fw-semibold">Username</label>
                <div class="input-group">
                    <span class="input-group-text bg-light text-secondary"><i class="bi bi-person"></i></span>
                    <input type="text" class="form-control" id="username" value="admin" required autofocus>
                </div>
            </div>
            
            <div class="mb-4">
                <label for="password" class="form-label text-secondary fw-semibold">Password</label>
                <div class="input-group">
                    <span class="input-group-text bg-light text-secondary"><i class="bi bi-lock"></i></span>
                    <input type="password" class="form-control" id="password" value="1234" required>
                </div>
            </div>
            
            <button type="submit" class="btn btn-primary w-100 py-2.5 fw-bold shadow-sm">
                <i class="bi bi-box-arrow-in-right me-2"></i>Sign In
            </button>
        </form>
    </div>
</div>

<!-- Bootstrap JS Bundle -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<script>
    // Check if user already logged in
    if (localStorage.getItem("hms_user")) {
        window.location.href = "/dashboard";
    }

    document.getElementById("loginForm").addEventListener("submit", async function(e) {
        e.preventDefault();
        
        const username = document.getElementById("username").value.trim();
        const password = document.getElementById("password").value;
        const alertBox = document.getElementById("alertBox");
        
        alertBox.classList.add("d-none");
        
        try {
            const response = await fetch("/api/auth/login", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({ username, password })
            });
            
            const data = await response.json();
            
            if (response.ok && data.success) {
                localStorage.setItem("hms_user", data.username);
                window.location.href = "/dashboard";
            } else {
                alertBox.textContent = data.message || "Authentication failed. Please check credentials.";
                alertBox.classList.remove("d-none");
            }
        } catch (error) {
            alertBox.textContent = "Unable to connect to service. Ensure database configuration matches.";
            alertBox.classList.remove("d-none");
            console.error("Login error:", error);
        }
    });
</script>
</body>
</html>
